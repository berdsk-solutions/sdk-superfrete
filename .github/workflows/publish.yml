name: Publish to NuGet

on:
  push:
    branches:
      - master
      - develop

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: 6.x

      - name: Determine Version
        uses: gittools/actions/gitversion/execute@v3
        id: gitversion
        with:
          useConfigFile: true

      - name: Resolve Version
        id: version
        run: |
          if [ "${{ github.ref }}" == "refs/heads/master" ]; then
            echo "value=${{ steps.gitversion.outputs.majorMinorPatch }}" >> $GITHUB_OUTPUT
          else
            echo "value=${{ steps.gitversion.outputs.semVer }}" >> $GITHUB_OUTPUT
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: |
          echo "Building version: ${{ steps.version.outputs.value }}"
          dotnet build --configuration Release --no-restore /p:Version="${{ steps.version.outputs.value }}"

      - name: Pack
        run: dotnet pack --configuration Release --no-build --output ./nupkg /p:Version="${{ steps.version.outputs.value }}"

      - name: Push to NuGet
        if: github.event_name == 'push'
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  publish-skill:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    needs: build-and-publish
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: 6.x

      - name: Determine Version
        uses: gittools/actions/gitversion/execute@v3
        id: gitversion
        with:
          useConfigFile: true

      - name: Pack Skill
        run: |
          cp -r claude-skill berdsk-superfrete-skill
          zip -r berdsk-superfrete-skill.zip berdsk-superfrete-skill/

      - name: Publish GitHub Release with Skill
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.gitversion.outputs.majorMinorPatch }}"
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes \
            berdsk-superfrete-skill.zip \
          || gh release upload "v${VERSION}" berdsk-superfrete-skill.zip --clobber